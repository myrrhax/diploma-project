services:
  db:
    image: postgres:latest
    container_name: db
    env_file:
      - docker/.env
    restart: unless-stopped
    networks:
      - backend
    volumes:
      - pg_db:/var/lib/postgresql

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:management
    hostname: rabbitmq
    restart: unless-stopped
    env_file:
      - docker/.env
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    networks:
      - rabbit-network
    ports:
      - "15672:15672"

  core:
    container_name: core
    build:
      context: .
      dockerfile: core/Dockerfile
      args:
        - PORT=8000
    restart: unless-stopped
    env_file:
      - docker/.env
    environment:
      - SERVER_PORT=8000
      - APP_FILES_SAVEDIR=/var/lib/files
      - APP_SECURITY_ALLOWED_ORIGINS=http://localhost:8080,http://0.0.0.0:8080,http://ui:8080
    volumes:
      - files_data:/var/lib/files
    depends_on:
      - db
      - rabbitmq
      - redis
    networks:
      - backend
      - proxy-net
      - rabbit-network
      - redis-net

  notifications:
    container_name: notifications
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    restart: unless-stopped
    env_file:
      - docker/.env
    depends_on:
      - rabbitmq
      - core
    networks:
      - rabbit-network

  redis:
    image: redis:7.2-alpine
    container_name: redis_cache
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - redis-net

  ui:
    container_name: ui
    build:
      context: .
      dockerfile: ui/Dockerfile
      args:
        - PORT=80
        - VITE_API_BASE_URL=https://myrrermdev.space
    restart: unless-stopped
    depends_on:
      - core
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - etc-letsencrypt:/etc/letsencrypt
      - www-certbot:/var/certbot
    networks:
      - proxy-net
    ports:
      - "80:80"
      - "443:443"

  certbot:
    image: certbot/certbot
    depends_on:
      - ui
    container_name: certbot
    volumes:
      - etc-letsencrypt:/etc/letsencrypt
      - www-certbot:/var/www/html
    command: certonly --webroot --webroot-path=/var/www/html --register-unsafely-without-email --agree-tos -d myrrermdev.space

networks:
  backend:
    driver: bridge
  proxy-net:
    driver: bridge
  rabbit-network:
    driver: bridge
  redis-net:
    driver: bridge

volumes:
  pg_db:
  rabbitmq:
  redis_data:
  files_data:
  www-certbot:
  etc-letsencrypt: